<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Finance Controller</title>
<style>body{margin:0;background:#f5f7fb;color:#14213d;font:15px Inter,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:42px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0}.sub{color:#667085}button{background:#175cd3;color:white;border:0;border-radius:7px;padding:11px 16px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:28px 0}.card,section{background:white;border:1px solid #e6e9f0;border-radius:10px;padding:18px;box-shadow:0 2px 8px #1018280b}.label{font-size:12px;color:#667085}.value{font-size:25px;font-weight:750;margin-top:8px}section{margin-top:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f4}th{color:#667085;font-size:12px}select{padding:8px;border:1px solid #d0d5dd;border-radius:6px}</style></head>
<body><main><header><div><h1>AI Finance Controller</h1><p class="sub">Assisted reconciliation · synthetic, seeded demo · review exceptions are never hidden</p></div><button onclick="runDemo()">Run demo</button></header>
<div class="cards" id="cards"></div><section><h2>Reconciliation progress</h2><p id="progress" class="sub">Generate and reconcile the seeded demo dataset.</p></section><section><h2>Exceptions <select onchange="loadExceptions(this.value)"><option value="">All reasons</option><option>LOW_CONFIDENCE</option><option>MULTIPLE_CANDIDATES</option><option>MISSING_RECORD</option></select></h2><table><thead><tr><th>ID</th><th>Record</th><th>Amount</th><th>Reason</th><th>Confidence</th><th>Why</th></tr></thead><tbody id="exceptions"></tbody></table></section></main>
<script>const money=x=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(x||0);async function runDemo(){await fetch('/generate-data',{method:'POST'});await fetch('/reconcile',{method:'POST'});await refresh()}async function refresh(){let s=await (await fetch('/status')).json(),m=s.metrics||{};document.getElementById('progress').textContent=`${s.processed||0} of ${s.records_loaded||0} invoice records processed · ${s.exceptions||0} held for human review`;let k=[['Records Processed',s.processed||0],['Match Rate',`${((m.match_rate||0)*100).toFixed(1)}%`],['Precision',`${((m.precision||0)*100).toFixed(1)}%`],['False Match Rate',`${((m.false_match_rate||0)*100).toFixed(1)}%`],['Exceptions',s.exceptions||0],['₹ Unresolved',money(m.unresolved_financial_value)]];document.getElementById('cards').innerHTML=k.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');loadExceptions('')}async function loadExceptions(reason){let u='/exceptions'+(reason?'?reason='+encodeURIComponent(reason):''),rows=await (await fetch(u)).json();document.getElementById('exceptions').innerHTML=rows.map(x=>`<tr><td>${x.id}</td><td>${x.source_record_id}</td><td>${money(x.amount)}</td><td>${x.reason_codes.join(', ')}</td><td>${(x.confidence*100).toFixed(1)}%</td><td>${x.evidence[0]}</td></tr>`).join('')}refresh()</script></body></html>
